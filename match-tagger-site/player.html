<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070A">
<title>Player portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#0B0F14; --muted:#56616D; --line:#D3DAE1;
  --accent:#0078BF; --accent-ink:#FFFFFF; --accent-soft:#DCEBF7; --warn:#C7702A; --bad:#BE4430; --good:#1F7A4F;
  --hero-bg:#05070A; --hero-ink:#F2F5F8; --hero-muted:#9AA7B4; --hero-line:rgba(255,255,255,.14); --hero-accent-text:#5DB4F0;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(10,15,20,.06),0 4px 14px rgba(10,15,20,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07090C; --surface:#0F1318; --surface-2:#151A21; --ink:#E6EBF0; --muted:#8F9BA8; --line:#232B34;
  --accent:#1F84C8; --accent-soft:#0E2436; --warn:#E08C48; --bad:#E06A52; --good:#2E8C5E; --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;min-height:100vh;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top{background:var(--hero-bg);color:var(--hero-ink);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:54px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-accent-text)}
.top .sp{flex:1}
.top button{background:none;border:1px solid var(--hero-line);color:var(--hero-ink);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600}
#topActs{display:flex;gap:6px;flex:none}.top button{white-space:nowrap}
@media (max-width:400px){.brand{font-size:16px;letter-spacing:.08em}.top button{padding:5px 8px;font-size:13px}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.gate{min-height:calc(100vh - 54px);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.gate .card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;margin:0;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:0}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px}
label.f input{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px;font-size:17px;font-weight:400;width:100%}
label.f input:focus{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--bad);font-weight:700;font-size:14px;margin:0}
.ok{color:var(--good);font-weight:700;font-size:14px;margin:0}
.pw{position:relative}.pw button{position:absolute;right:8px;bottom:8px;background:none;border:0;color:var(--muted);font-size:13px;font-weight:700}
main{padding:16px 0 40px}
.hello{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.row:hover{border-color:var(--accent)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row b{font-size:17px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--accent);color:#fff;white-space:nowrap}
.badge.soft{background:var(--accent-soft);color:var(--ink)}
.chev{color:var(--muted);font-size:22px}
.player{position:sticky;top:54px;z-index:3;background:var(--bg);padding:8px 0 10px}
video{width:100%;max-height:56vh;background:#000;border-radius:12px;display:block}
.now{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.now .t{flex:1;min-width:0}
.clip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:12px;padding:10px 12px}
.clip.cur{outline:2px solid var(--accent);outline-offset:1px}
.clip .min{font-variant-numeric:tabular-nums;font-weight:700;min-width:46px;color:var(--muted)}
.clip .main{flex:1;min-width:0;display:flex;flex-direction:column}
.clip .who{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip .cnote{font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.cnote-full{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:8px 0 0;font-size:15px;white-space:pre-wrap}
.cnote-full b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.clip .cm{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.clip .cnote{border-left:2px solid var(--line);padding-left:7px}
.sec{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.thread{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.msg{max-width:85%;padding:8px 11px;border-radius:12px;font-size:15px;background:var(--surface-2);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg small{display:block;color:var(--muted);font-size:12px}
.compose{display:flex;gap:6px;margin-top:6px}
.compose textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;resize:none;min-height:44px;font-size:15px}
.back{background:none;border:0;padding:0;color:var(--muted);font-weight:700;font-size:15px;margin-bottom:6px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--muted)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:15px}
.mi{white-space:nowrap}.mi+.mi{border-left:1px solid color-mix(in srgb,currentColor 32%,transparent);margin-left:.3em;padding-left:.55em}
.tabs .n{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;line-height:20px;text-align:center;vertical-align:2px;letter-spacing:0}
.tabs button[aria-selected="true"] .n{background:var(--accent);border-color:var(--accent);color:#fff}
.score{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mhead .score{font-size:30px}
.vbox{position:relative}
.sb{position:absolute;top:10px;right:10px;display:flex;align-items:stretch;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.35);pointer-events:none;user-select:none}
.sb>span{display:flex;align-items:center;padding:6px 9px}
.sbt{background:rgba(5,7,10,.86);color:#F2F5F8}.sbt.us{color:#7CC3F3}
.sbs{background:var(--accent);color:#fff;font-variant-numeric:tabular-nums;min-width:52px;justify-content:center}
.sbc{background:rgba(242,245,248,.94);color:#0B0F14;font-variant-numeric:tabular-nums;min-width:50px;justify-content:center;gap:3px}
.sbc small{font-size:12px;color:var(--bad)}.sbc:empty{display:none}
@media (max-width:520px){.sb{top:6px;right:6px;font-size:14px}.sb>span{padding:5px 7px}.sbs{min-width:42px}.sbc{min-width:42px}}
.tl{margin-top:10px;user-select:none}
.tl-goals{position:relative;height:30px}
.tg{position:absolute;bottom:2px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;color:var(--bad)}
.tg.lv1{bottom:16px}
.tg b{font-size:12px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tg i{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px var(--bg)}
.tg.us{color:var(--accent)}
.tl-track{position:relative;height:22px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;cursor:pointer}
.tl:not(.full) .tl-track{cursor:default}
.tl-track .half{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 13%,transparent)}
.tl-track .mk{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);opacity:.55}
.tl-track .tc{position:absolute;top:4px;bottom:4px;min-width:5px;border:0;border-radius:3px;padding:0;background:var(--c);cursor:pointer}
.tl-track .tc.cur{top:1px;bottom:1px;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.tl-track .ph{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--bad);pointer-events:none}
.tl-labs{position:relative;height:18px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.tl-labs span{position:absolute;top:2px;transform:translateX(-50%)}
.tl-labs span:first-child{transform:none}.tl-labs span:last-child:not(:first-child){transform:translateX(-100%)}
.moments{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.mo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px}
.mo:first-child{border-top:0}
button.mo:hover{background:var(--surface-2)}
.mo .mt{min-width:44px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.mo .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.mo.gl .dot{background:var(--bad)}.mo.gl.us .dot{background:var(--accent)}
.mo.cl .dot{border-radius:3px;background:var(--c)}
.mo.ph{background:var(--surface-2)}.mo.ph .mt,.mo.ph b{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.mo.cur{box-shadow:inset 3px 0 0 var(--accent)}
.mo .mnote{font-size:14px;margin-top:3px;padding-left:8px;border-left:2px solid var(--accent)}
.gsc{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;color:var(--ink);margin-top:2px}
.gsc>span{display:inline-flex;align-items:center;gap:6px}.gsc i{font-style:normal;font-size:15px;line-height:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mo .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.mo .msc{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--hero-bg);color:var(--hero-ink);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;max-width:90vw}
</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="brand">Player portal</span><span class="sp"></span><span id="topActs"></span></div></header>
<div id="app"></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={api:'mtp.api',tok:'mtp.token'};
const get=k=>{ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }, put=(k,v)=>{ try{ v?localStorage.setItem(k,v):localStorage.removeItem(k); }catch(e){} };
/* the storage address comes from the link the coach sends (?s=...) and is remembered */
(function(){ const q=new URLSearchParams(location.search).get('s'); if(q){ put(LS.api,q.replace(/^https:\/\//,'').replace(/\/+$/,'')); history.replaceState(null,'',location.pathname); } })();
const API=()=>{ const h=get(LS.api); return !h?'':/^http:\/\//.test(h)?h:'https://'+h; };
const S={mcur:null, tok:get(LS.tok), me:null, must:false, feed:null, tab:'clips', batch:null, match:null, cur:null, comments:{}, err:'', oldPw:'', busy:false, vids:{}, chg:false};
function toast(t){ const n=document.createElement('div'); n.className='toast'; n.textContent=t; document.body.appendChild(n); setTimeout(()=>n.remove(),2800); }
async function call(path,body,method){
  const h={'Content-Type':'application/json'}; if(S.tok) h.Authorization='Bearer '+S.tok;
  let r; try{ r=await fetch(API()+path,{method:method||(body?'POST':'GET'),headers:h,body:body?JSON.stringify(body):undefined}); }
  catch(e){ throw new Error('No connection. Check your internet and try again.'); }
  let d={}; try{ d=await r.json(); }catch(e){}
  if(r.status===401&&path!=='/api/p/login'){ logout(true); throw new Error('Please log in again.'); }
  if(!r.ok) throw new Error(d.error||('Error '+r.status)); return d; }
function logout(quiet){ S.tok=''; put(LS.tok,''); S.feed=null; S.me=null; S.batch=null; S.match=null; S.cur=null; if(!quiet) toast('Logged out.'); render(); }
const first=n=>String(n||'').split(' ')[0];
const mj=parts=>parts.filter(x=>x!=null&&x!=='').map(x=>'<span class="mi">'+x+'</span>').join(' ');
const META=id=>((S.feed&&S.feed.meta)||{})[id]||null;
const pad=n=>String(n).padStart(2,'0'), mmss=s=>{ s=Math.max(0,Math.floor(s)); return pad(Math.floor(s/60))+':'+pad(s%60); };
/* goals start 15 s before the tag, like in the coach's tagger, so the build-up is in view */
const GOAL_PRE=15, goalStart=g=>Math.max(0,g.t-GOAL_PRE);
const goalClip=(g,clips,used)=>clips.find(c=>!(used&&used.has(c.id))&&/goal/i.test(c.label)&&c.t0-GOAL_PRE-1<=g.t&&g.t<=c.t1+1)||null;
/* a goal clip published before this change may still start late: start it 15 s before the goal anyway */
function clipStart(i){ const md=META(i.mid); if(!md||!/goal/i.test(i.label||'')) return i.t0;
  const g=(md.goals||[]).find(g=>i.t0-1<=g.t&&g.t<=i.t1+1); return g?Math.min(i.t0,goalStart(g)):i.t0; }
const scoreStr=a=>a[0]+'\u2013'+a[1];
/* match clock from the coach's phase marks (video seconds) */
function clockOf(md,t){ const p=md.ph||{}, L=(+md.half||45)*60;
  if(p.h1s==null) return null; if(t<p.h1s) return {ph:'pre'};
  if(p.h1e==null||t<p.h1e){ const e=t-p.h1s; return {ph:'1H',s:Math.min(e,L),x:Math.max(0,e-L)}; }
  if(p.h2s==null||t<p.h2s) return {ph:'HT'};
  if(p.h2e==null||t<p.h2e){ const e=t-p.h2s; return {ph:'2H',s:L+Math.min(e,L),x:Math.max(0,e-L)}; }
  return {ph:'FT'}; }
function scoreAt(md,t){ let us=0,them=0; (md.goals||[]).forEach(g=>{ if(g.t<=t+.05){ if(g.us) us++; else them++; } }); return md.home?[us,them]:[them,us]; }
/* every match the player can open: full matches the coach shared, plus matches that hold her own clips */
function matchList(){ const f=S.feed, map=new Map(); if(!f) return [];
  f.matches.forEach(m=>map.set(m.id,Object.assign({full:true},m)));
  f.batches.forEach(b=>b.items.forEach(i=>{ if(i.mine&&!map.has(i.mid)) map.set(i.mid,{id:i.mid,title:i.match||'Match',date:i.date||'',type:'',comp:'',score:'',full:false}); }));
  return [...map.values()].map(m=>{ const md=META(m.id); if(!m.score&&md&&m.full===false&&md.ph&&md.ph.h2e!=null) m.score=scoreStr(scoreAt(md,Infinity)); return m; })
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }
function myClips(mid){ const seen=new Set(), out=[]; (S.feed?S.feed.batches:[]).forEach(b=>b.items.forEach(i=>{ if(i.mine&&i.mid===mid&&!seen.has(i.id)){ seen.add(i.id); out.push(i); } })); return out.sort((a,b)=>a.t0-b.t0); }
const fmtD=d=>{ try{ return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }catch(e){ return d||''; } };
function top(){ $('#topActs').innerHTML=S.feed&&!S.must?`<button data-chg>Password</button> <button data-out>Log out</button>`:''; }

function render(){
  top();
  if(!API()){ app.innerHTML=`<div class="gate"><div class="card"><h1>Player portal</h1><p>Open the link your coach sent you to log in.</p></div></div>`; return; }
  if(!S.tok){ app.innerHTML=`<div class="gate"><form class="card" id="fLogin" autocomplete="on"><span class="eyebrow">Welcome</span><h1>Log in</h1>
      <label class="f">Username<input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="FirstnameLastname" required></label>
      <label class="f pw">Password<input id="p" type="password" autocomplete="current-password" required><button type="button" data-show="p">Show</button></label>
      ${S.err?`<p class="err">${esc(S.err)}</p>`:''}<button class="btn primary" type="submit" ${S.busy?'disabled':''}>${S.busy?'Logging in…':'Log in'}</button>
      <p class="hint">Your username is your first and last name without spaces, for example <b>LizDeBlock</b>. Forgot your password? Ask your coach to reset it.</p></form></div>`;
    setTimeout(()=>{ const u=$('#u'); if(u) u.focus(); },30); return; }
  if(S.must||S.chg){ app.innerHTML=`<div class="gate"><form class="card" id="fPw"><span class="eyebrow">${S.must?'First login':'Your password'}</span><h1>${S.must?'Choose your own password':'Change password'}</h1>
      ${S.must?'<p class="hint">You logged in with your starting password. Pick your own now: only you will know it.</p>':`<label class="f pw">Current password<input id="p0" type="password" autocomplete="current-password" required><button type="button" data-show="p0">Show</button></label>`}
      <label class="f pw">New password<input id="p1" type="password" autocomplete="new-password" minlength="6" required><button type="button" data-show="p1">Show</button></label>
      <label class="f">Repeat new password<input id="p2" type="password" autocomplete="new-password" minlength="6" required></label>
      ${S.err?`<p class="err">${esc(S.err)}</p>`:''}<button class="btn primary" type="submit" ${S.busy?'disabled':''}>Save password</button>
      ${S.chg&&!S.must?'<button class="btn" type="button" data-chgcancel>Cancel</button>':'<p class="hint">At least 6 characters.</p>'}</form></div>`; return; }
  if(!S.feed){ app.innerHTML=`<div class="gate"><p class="hint">${S.err?esc(S.err):'Loading…'}</p></div>`; if(!S.err) load(); return; }
  if(S.batch) return renderBatch();
  if(S.match) return renderMatch();
  const f=S.feed, ml=matchList(), bs=f.batches.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  app.innerHTML=`<main class="wrap"><div class="hello"><span class="eyebrow">${esc(f.me.username)}</span><h1>Hi ${esc(first(f.me.name))}</h1></div>
    <div class="tabs" role="tablist"><button data-tab="clips" aria-selected="${S.tab==='clips'}">Clips<span class="n">${bs.length}</span></button><button data-tab="matches" aria-selected="${S.tab==='matches'}">Matches<span class="n">${ml.length}</span></button></div>
    ${S.tab==='clips'?(bs.length?`<div class="list">${bs.map(b=>{ const mine=b.items.filter(i=>i.mine).length; return `<button class="row" data-batch="${esc(b.id)}"><span class="main"><b>${esc(b.name)}</b><span class="hint">${mj([esc(fmtD(b.date)),b.items.length+' clip'+(b.items.length===1?'':'s')])}</span></span>${mine?`<span class="badge">${mine} of you</span>`:''}<span class="chev">›</span></button>`; }).join('')}</div>`:'<div class="empty">No clips yet. Your coach will share them here.</div>')
      :(ml.length?`<div class="list">${ml.map(m=>{ const n=myClips(m.id).length; return `<button class="row" data-match="${esc(m.id)}"><span class="main"><b>${esc(m.title)}</b><span class="hint">${mj([fmtD(m.date),m.type,m.comp,m.full?'':'Your clips only'].filter(Boolean).map(esc))}</span></span>${n?`<span class="badge soft">${n} of you</span>`:''}${m.score?`<span class="score">${esc(m.score)}</span>`:''}<span class="chev">›</span></button>`; }).join('')}</div>`:'<div class="empty">No matches shared yet.</div>')}
  </main>`;
}
const sortItems=b=>b.items.slice().sort((x,y)=>(y.mine-x.mine)||(x.date||'').localeCompare(y.date||'')||x.t0-y.t0);
function clipsHtml(b){ const items=sortItems(b), cms=S.comments[b.id]||[], nC=id=>cms.filter(c=>c.item===id).length, mine=items.filter(i=>i.mine), team=items.filter(i=>!i.mine);
  const clip=i=>`<button class="clip${S.cur===i.id?' cur':''}" style="--c:${esc(i.color||'#6B6F78')}" data-clip="${esc(i.id)}"><span class="min">${esc(i.minute||'')}</span><span class="main"><b>${esc(i.label)}</b><span class="who">${mj([esc(i.who||''),esc(i.match||'')])}</span>${i.note?`<span class="cnote">${esc(i.note)}</span>`:''}</span>${nC(i.id)?`<span class="cm">${nC(i.id)} message${nC(i.id)===1?'':'s'}</span>`:''}${i.mine?'<span class="badge">You</span>':''}</button>`;
  return `${mine.length&&team.length?'<div class="sec">Your clips</div>':''}<div class="list">${mine.map(clip).join('')}</div>${team.length?(mine.length?'<div class="sec">Team clips</div>':'')+`<div class="list">${team.map(clip).join('')}</div>`:''}`; }
function threadHtml(b){ const cms=(S.comments[b.id]||[]).filter(c=>c.item===S.cur);
  return `${cms.map(c=>`<div class="msg${c.by==='player'?' me':''}">${esc(c.text)}<small>${mj([c.by==='player'?'You':'Coach',esc(new Date(c.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))])}</small></div>`).join('')}
    <div class="compose"><textarea id="cmt" rows="1" placeholder="Comment or question for your coach"></textarea><button class="btn primary sm" data-send>Send</button></div><p class="hint">Only you and your coach see this conversation.</p>`; }
/* comments arrive later: refresh only the conversation and the clip list, never the video */
function refreshSide(){ const b=S.feed&&S.feed.batches.find(x=>x.id===S.batch); if(!b) return; const th=$('#thread'), cl=$('#clips'); const draft=$('#cmt')?$('#cmt').value:'';
  if(th&&S.cur){ th.innerHTML=threadHtml(b); const t=$('#cmt'); if(t) t.value=draft; } if(cl) cl.innerHTML=clipsHtml(b); }
function renderBatch(){
  const b=S.feed.batches.find(x=>x.id===S.batch); if(!b){ S.batch=null; return render(); }
  const items=sortItems(b), cur=items.find(i=>i.id===S.cur)||null;
  app.innerHTML=`<main class="wrap"><button class="back" data-home>← All clips</button><h2>${esc(b.name)}</h2><p class="hint">${mj([esc(fmtD(b.date)),items.length+' clip'+(items.length===1?'':'s')])}</p>
    ${b.note?`<p class="note">${esc(b.note)}</p>`:''}
    <div class="player"${cur?'':' hidden'}><div class="vbox"><video id="vid" controls playsinline preload="metadata"></video>${cur&&META(cur.mid)?sbHtml(META(cur.mid),cur.mid):''}</div>
      <div class="now"><span class="t">${cur?`<b>${esc(cur.minute)} ${esc(cur.label)}</b> <span class="hint">${esc(cur.match)}</span>`:''}</span><button class="btn sm" data-replay>Replay</button><button class="btn sm primary" data-next>Next ›</button></div>
      ${cur&&cur.note?`<p class="cnote-full"><b>Coach's note</b>${esc(cur.note)}</p>`:''}
      ${cur?`<div class="thread" id="thread">${threadHtml(b)}</div>`:''}</div>
    ${cur?'':'<p class="hint">Tap a clip to watch it.</p>'}
    <div id="clips">${clipsHtml(b)}</div></main>`;
  if(cur) playClip(cur);
  if(!S.comments[b.id]) loadComments(b.id);
}
const sbHtml=(md,mid)=>{ const L=md.home?[md.us,md.them]:[md.them,md.us];
  return `<div class="sb" id="sb" data-mid="${esc(mid)}" aria-hidden="true"><span class="sbt${md.home?' us':''}">${esc(L[0])}</span><span class="sbs" id="sbs">0–0</span><span class="sbt${md.home?'':' us'}">${esc(L[1])}</span><span class="sbc" id="sbc"></span></div>`; };
function sbUpdate(t){ const sb=$('#sb'); if(!sb) return; const md=META(sb.dataset.mid); if(!md) return;
  $('#sbs').textContent=scoreStr(scoreAt(md,t)); const c=clockOf(md,t), el=$('#sbc');
  el.innerHTML=!c||c.ph==='pre'?'':c.ph==='HT'||c.ph==='FT'?c.ph:mmss(c.s)+(c.x>0?`<small>+${Math.ceil(c.x/60)}</small>`:''); }
function tlRange(md,clips,D){ const p=(md&&md.ph)||{}; let lo=0, hi=D||0;
  if(p.h1s!=null) lo=Math.max(0,p.h1s-20);
  if(p.h2e!=null) hi=D?Math.min(D,p.h2e+20):p.h2e+20;
  if(!hi){ const ends=clips.map(c=>c.t1).concat(((md&&md.goals)||[]).map(g=>g.t),[p.h1e,p.h2s].filter(x=>x!=null)); hi=Math.max(60,...ends)+30; }
  if(hi<=lo) hi=lo+60; return [lo,hi]; }
function tlHtml(md,clips,full,D){
  const [lo,hi]=tlRange(md,clips,D), pc=t=>Math.max(0,Math.min(100,(t-lo)/(hi-lo)*100)), X=t=>pc(t).toFixed(3)+'%', W=(a,b)=>Math.max(0,pc(b)-pc(a)).toFixed(3)+'%';
  const p=(md&&md.ph)||{}, goals=((md&&md.goals)||[]).slice().sort((a,b)=>a.t-b.t);
  const halves=[[p.h1s,p.h1e],[p.h2s,p.h2e]].filter(h=>h[0]!=null).map(h=>`<i class="half" style="left:${X(h[0])};width:${W(h[0],h[1]!=null?h[1]:hi)}"></i>`).join('');
  const marks=[[p.h1s,'KO'],[p.h1e,'HT'],[p.h2e,'FT']].filter(x=>x[0]!=null);
  let last=-99, lv=0; const gl=goals.map(g=>{ const x=pc(g.t); lv=x-last<6?1-lv:0; last=x;
    const gc=goalClip(g,clips), tag=full||gc?'button':'span', team=g.us?md.us:md.them;
    return `<${tag} class="tg${g.us?' us':''}${lv?' lv1':''}" style="left:${X(g.t)}"${gc?` type="button" data-mclip="${esc(gc.id)}"`:full?` type="button" data-seek="${goalStart(g)}"`:''} title="${esc(g.min+' goal '+team+(g.who?', '+g.who:'')+(g.ast?', assist '+g.ast:''))}"><b>${esc(g.min)}</b><i></i></${tag}>`; }).join('');
  return `<div class="tl${full?' full':''}" id="tl" data-lo="${lo}" data-hi="${hi}">
    <div class="tl-goals">${gl}</div>
    <div class="tl-track" data-track>${halves}${marks.map(x=>`<i class="mk" style="left:${X(x[0])}"></i>`).join('')}${clips.map(c=>`<button class="tc${S.mcur===c.id?' cur':''}" type="button" style="left:${X(c.t0)};width:${W(c.t0,c.t1)};--c:${esc(c.color||'#6B6F78')}" data-mclip="${esc(c.id)}" aria-label="${esc(c.minute+' '+c.label)}"></button>`).join('')}<i class="ph" id="ph" style="left:0"></i></div>
    <div class="tl-labs">${marks.map(x=>`<span style="left:${X(x[0])}">${x[1]}</span>`).join('')}</div></div>`; }
function momentsHtml(md,clips,full){
  const p=(md&&md.ph)||{}, ev=[], L=(md&&+md.half)||45;
  if(p.h1s!=null) ev.push({t:p.h1s,o:0,k:'ph',min:"0'",tx:'Kick-off'});
  if(p.h1e!=null) ev.push({t:p.h1e,o:2,k:'ph',min:'HT',tx:'Half-time',sc:1});
  if(p.h2s!=null) ev.push({t:p.h2s,o:0,k:'ph',min:L+"'",tx:'Second half'});
  if(p.h2e!=null) ev.push({t:p.h2e,o:2,k:'ph',min:'FT',tx:'Full time',sc:1});
  const used=new Set();
  ((md&&md.goals)||[]).forEach(g=>{ const c=goalClip(g,clips,used); if(c) used.add(c.id);
    ev.push({t:g.t,go:goalStart(g),o:1,k:'gl'+(g.us?' us':''),min:g.min,tx:'Goal '+(g.us?md.us:md.them),gs:g,note:c&&c.note,sc:1,clip:c||null}); });
  clips.forEach(c=>{ if(!used.has(c.id)) ev.push({t:c.t0,o:1,k:'cl',min:c.minute,tx:c.label,note:c.note,clip:c}); });
  ev.sort((a,b)=>a.t-b.t||a.o-b.o);
  return ev.map(e=>{ const click=e.clip||(full&&md); const tag=click?'button':'div';
    const attr=e.clip?` type="button" data-mclip="${esc(e.clip.id)}"`:click?` type="button" data-seek="${e.go!=null?e.go:e.t}"`:'';
    return `<${tag} class="mo ${e.k}${e.clip&&S.mcur===e.clip.id?' cur':''}"${attr}${e.clip&&e.k==='cl'?` style="--c:${esc(e.clip.color||'#6B6F78')}"`:''}><span class="mt">${esc(e.min||'')}</span><span class="dot"></span><span class="tx"><b>${esc(e.tx)}</b>${e.gs&&(e.gs.who||e.gs.ast)?`<span class="gsc">${e.gs.who?`<span><i aria-hidden="true">⚽</i><span class="sr">Scored by </span>${esc(e.gs.who)}</span>`:''}${e.gs.ast?`<span><i aria-hidden="true">🅰️</i><span class="sr">Assist by </span>${esc(e.gs.ast)}</span>`:''}</span>`:''}${e.sub?`<span class="hint">${esc(e.sub)}</span>`:''}${e.note?`<span class="mnote">${esc(e.note)}</span>`:''}</span>${e.clip?'<span class="badge">Your clip</span>':''}${e.sc&&md?`<span class="msc">${scoreStr(scoreAt(md,e.t))}</span>`:''}</${tag}>`; }).join(''); }
function tlUpdate(){ const v=$('#vid'), tl=$('#tl'), ph=$('#ph'); if(!v) return; const t=v.currentTime||0;
  if(tl&&ph){ const lo=+tl.dataset.lo, hi=+tl.dataset.hi; ph.style.left=Math.max(0,Math.min(100,(t-lo)/(hi-lo)*100))+'%'; }
  sbUpdate(t); }
function renderMatch(){
  const m=matchList().find(x=>x.id===S.match); if(!m){ S.match=null; return render(); }
  stopAt=null; S.mcur=null;
  const md=META(m.id), clips=myClips(m.id), hasTl=!!(md||clips.length);
  app.innerHTML=`<main class="wrap"><button class="back" data-home>← All matches</button>
    <div class="mhead"><h2>${esc(m.title)}</h2>${m.score?`<span class="score">${esc(m.score)}</span>`:''}</div>
    <p class="hint">${mj([fmtD(m.date),m.type,m.comp].filter(Boolean).map(esc))}</p>
    ${m.full?'':'<p class="hint">Your coach shared your own clips from this match. Tap one on the timeline to watch it.</p>'}
    <div class="player"><div class="vbox"><video id="vid" controls playsinline preload="metadata" data-mid="${esc(m.id)}"></video>${md?sbHtml(md,m.id):''}</div>
      ${hasTl?`<div id="tlw">${tlHtml(md,clips,m.full,0)}</div>`:''}</div>
    ${hasTl?`<div class="sec">Match timeline</div><div class="moments" id="moments">${momentsHtml(md,clips,m.full)}</div>`:''}</main>`;
  tlUpdate();
  videoUrl(m.id).then(u=>{ const v=$('#vid'); if(!v||!u) return;
    v.addEventListener('loadedmetadata',()=>{ const w=$('#tlw'); if(w&&S.match===m.id){ w.innerHTML=tlHtml(md,clips,m.full,v.duration); tlUpdate(); } },{once:true}); v.src=u; }).catch(e=>toast(e.message));
}
function mRefresh(){ const m=matchList().find(x=>x.id===S.match); if(!m) return; const md=META(m.id), clips=myClips(m.id), v=$('#vid'), w=$('#tlw'), mo=$('#moments');
  if(w) w.innerHTML=tlHtml(md,clips,m.full,v&&v.duration||0); if(mo) mo.innerHTML=momentsHtml(md,clips,m.full); tlUpdate(); }
function mPlay(t,until){ const v=$('#vid'); if(!v) return; stopAt=until==null?null:until; stopFrom=t;
  const go=()=>{ try{ v.currentTime=t; }catch(e){} const p=v.play(); if(p&&p.catch) p.catch(()=>{}); };
  if(v.readyState>=1) go(); else v.addEventListener('loadedmetadata',go,{once:true}); }
async function videoUrl(mid){ const c=S.vids[mid]; if(c&&c.exp>Date.now()+10*60e3) return c.url; const d=await call('/api/p/video',{mid}); S.vids[mid]=d; return d.url; }
let stopAt=null, stopFrom=0;
async function playClip(i){
  const v=$('#vid'); if(!v) return; let u; try{ u=await videoUrl(i.mid); }catch(e){ toast(e.message); return; }
  const t0=clipStart(i); stopAt=i.t1; stopFrom=t0; const go=()=>{ try{ v.currentTime=t0; }catch(e){} const p=v.play(); if(p&&p.catch) p.catch(()=>{}); };
  if(v.dataset.mid!==i.mid||!v.src){ v.dataset.mid=i.mid; const sb=$('#sb'); if(sb) sb.dataset.mid=i.mid; v.src=u; v.addEventListener('loadedmetadata',go,{once:true}); } else go();
}
document.addEventListener('timeupdate',e=>{ const v=e.target; if(v.id!=='vid') return; if(stopAt!=null&&v.currentTime>=stopAt){ v.pause(); if(S.match) stopAt=null; } tlUpdate(); },true);
['seeking','seeked','loadedmetadata'].forEach(n=>document.addEventListener(n,e=>{ const v=e.target; if(v.id!=='vid') return;
  if(n==='seeking'&&S.match&&stopAt!=null&&(v.currentTime<stopFrom-1||v.currentTime>stopAt+.5)) stopAt=null; tlUpdate(); },true));
async function load(){ try{ const d=await call('/api/p/feed'); S.feed=d; S.me=d.me; S.err=''; }catch(e){ S.err=e.message; } render(); }
async function loadComments(bid){ S.comments[bid]=S.comments[bid]||[]; try{ const d=await call('/api/p/comments?batch='+encodeURIComponent(bid)); S.comments[bid]=d.comments||[]; if(S.batch===bid) refreshSide(); }catch(e){} }
document.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='fLogin'){ const u=$('#u').value.trim(), p=$('#p').value; S.busy=true; S.err=''; render(); $('#u').value=u;
    try{ const d=await call('/api/p/login',{username:u,password:p}); S.tok=d.token; put(LS.tok,d.token); S.must=!!d.must; S.oldPw=p; S.me=d.me; S.busy=false; S.feed=null; render(); }
    catch(err){ S.busy=false; S.err=err.message; render(); const x=$('#u'); if(x) x.value=u; } return; }
  if(f.id==='fPw'){ const p0=S.must?S.oldPw:($('#p0')||{}).value, p1=$('#p1').value, p2=$('#p2').value;
    if(p1!==p2){ S.err='The two new passwords are not the same.'; render(); return; }
    S.busy=true; S.err=''; render();
    try{ const d=await call('/api/p/password',{old:p0,password:p1}); S.tok=d.token; put(LS.tok,d.token); S.must=false; S.chg=false; S.oldPw=''; S.busy=false; S.feed=null; toast('Password saved.'); render(); }
    catch(err){ S.busy=false; S.err=err.message; render(); } return; }
});
document.addEventListener('click',async e=>{
  const g=s=>e.target.closest(s); let b;
  if(b=g('[data-show]')){ const i=$('#'+b.dataset.show); if(i){ i.type=i.type==='password'?'text':'password'; b.textContent=i.type==='password'?'Show':'Hide'; } return; }
  if(g('[data-out]')){ logout(); return; }
  if(g('[data-chg]')){ S.chg=true; S.err=''; render(); return; }
  if(g('[data-chgcancel]')){ S.chg=false; S.err=''; render(); return; }
  if(b=g('[data-tab]')){ S.tab=b.dataset.tab; render(); return; }
  if(b=g('[data-batch]')){ S.batch=b.dataset.batch; S.cur=null; delete S.comments[S.batch]; window.scrollTo(0,0); render(); return; }
  if(b=g('[data-mclip]')){ const c=myClips(S.match).find(x=>x.id===b.dataset.mclip); if(c){ S.mcur=c.id; mRefresh(); mPlay(clipStart(c),c.t1); window.scrollTo({top:0,behavior:'smooth'}); } return; }
  if(b=g('[data-seek]')){ S.mcur=null; mRefresh(); mPlay(+b.dataset.seek); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(b=g('[data-track]')){ const tl=$('#tl'); if(!tl) return; if(!tl.classList.contains('full')){ toast('Only your own clips from this match are shared. Tap a coloured block.'); return; }
    const r=b.getBoundingClientRect(), f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); S.mcur=null; mRefresh(); mPlay(+tl.dataset.lo+f*(+tl.dataset.hi-+tl.dataset.lo)); return; }
  if(b=g('[data-match]')){ S.match=b.dataset.match; window.scrollTo(0,0); render(); return; }
  if(g('[data-home]')){ S.batch=null; S.match=null; S.cur=null; render(); return; }
  if(b=g('[data-clip]')){ S.cur=b.dataset.clip; renderBatch(); loadComments(S.batch); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(g('[data-replay]')){ const bt=S.feed.batches.find(x=>x.id===S.batch), it=bt&&bt.items.find(i=>i.id===S.cur); if(it) playClip(it); return; }
  if(g('[data-next]')){ const bt=S.feed.batches.find(x=>x.id===S.batch); if(!bt) return; const items=sortItems(bt), i=items.findIndex(x=>x.id===S.cur);
    if(i>=0&&i<items.length-1){ S.cur=items[i+1].id; renderBatch(); loadComments(S.batch); } else toast('That was the last clip.'); return; }
  if(b=g('[data-send]')){ const t=$('#cmt'), text=t?t.value.trim():''; if(!text) return; b.disabled=true;
    try{ const d=await call('/api/p/comments?batch='+encodeURIComponent(S.batch),{item:S.cur,text}); S.comments[S.batch]=d.comments||[]; toast('Sent to your coach.'); const t=$('#cmt'); if(t) t.value=''; refreshSide(); }
    catch(err){ b.disabled=false; toast(err.message); } return; }
});
render();
})();
</script>
